<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タイマー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: #16213e;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 360px;
    }

    h1 { font-size: 1.4rem; color: #a8b2d8; margin-bottom: 30px; letter-spacing: 2px; }

    .display {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #e94560;
      margin-bottom: 30px;
      font-variant-numeric: tabular-nums;
    }

    .display.running { text-shadow: 0 0 20px #e94560; }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .input-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }

    .input-group label { font-size: 0.7rem; color: #a8b2d8; letter-spacing: 1px; }

    .input-group input {
      width: 72px;
      text-align: center;
      font-size: 1.4rem;
      padding: 8px 4px;
      background: #0f3460;
      border: 2px solid #1a4a80;
      border-radius: 10px;
      color: #eee;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus { border-color: #e94560; }
    .input-group input:disabled { opacity: 0.4; cursor: not-allowed; }

    .buttons { display: flex; gap: 12px; justify-content: center; }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      letter-spacing: 1px;
    }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

    #btn-start  { background: #e94560; color: #fff; }
    #btn-pause  { background: #533483; color: #fff; }
    #btn-reset  { background: #0f3460; color: #a8b2d8; border: 2px solid #1a4a80; }

    .message {
      margin-top: 20px;
      font-size: 1rem;
      color: #e94560;
      min-height: 1.4em;
      font-weight: 600;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TIMER</h1>

    <div class="display" id="display" role="timer" aria-live="off" aria-atomic="true">00:00:00</div>

    <div class="input-row">
      <div class="input-group">
        <label for="hours">時間</label>
        <input type="number" id="hours" min="0" max="99" value="0">
      </div>
      <div class="input-group">
        <label for="minutes">分</label>
        <input type="number" id="minutes" min="0" max="59" value="5">
      </div>
      <div class="input-group">
        <label for="seconds">秒</label>
        <input type="number" id="seconds" min="0" max="59" value="0">
      </div>
    </div>

    <div class="buttons">
      <button id="btn-start">スタート</button>
      <button id="btn-pause">一時停止</button>
      <button id="btn-reset">リセット</button>
    </div>

    <div class="message" id="message" aria-live="assertive"></div>
  </div>

  <script>
    // State: 'idle' | 'running' | 'paused'
    let state = 'idle';
    let remaining = 0;
    let endTime = 0;
    let intervalId = null;

    const display  = document.getElementById('display');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');
    const message  = document.getElementById('message');
    const hInput   = document.getElementById('hours');
    const mInput   = document.getElementById('minutes');
    const sInput   = document.getElementById('seconds');

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateDisplay(totalSeconds) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      display.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function getInputSeconds() {
      return (parseInt(hInput.value) || 0) * 3600
           + (parseInt(mInput.value) || 0) * 60
           + (parseInt(sInput.value) || 0);
    }

    function renderUI() {
      const isIdle    = state === 'idle';
      const isRunning = state === 'running';
      const isPaused  = state === 'paused';

      btnStart.textContent  = isPaused ? '再開' : 'スタート';
      btnStart.disabled     = isRunning;
      btnPause.disabled     = !isRunning;
      btnReset.disabled     = false;

      display.classList.toggle('running', isRunning);
      [hInput, mInput, sInput].forEach(el => el.disabled = !isIdle);
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.8);
      } catch (_) {}
    }

    function tick() {
      const left = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      updateDisplay(left);

      if (left <= 0) {
        clearInterval(intervalId);
        intervalId = null;
        state = 'idle';
        remaining = 0;
        message.textContent = '時間になりました！';
        beep();
        renderUI();
      }
    }

    function start() {
      if (state === 'idle') {
        remaining = getInputSeconds();
        if (remaining <= 0) return;
      }
      message.textContent = '';
      endTime = Date.now() + remaining * 1000;
      state = 'running';
      renderUI();
      tick();
      intervalId = setInterval(tick, 500);
    }

    function pause() {
      if (state !== 'running') return;
      clearInterval(intervalId);
      intervalId = null;
      remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      state = 'paused';
      renderUI();
    }

    function reset() {
      clearInterval(intervalId);
      intervalId = null;
      state = 'idle';
      remaining = 0;
      message.textContent = '';
      updateDisplay(0);
      renderUI();
    }

    // 入力値をmin/maxの範囲にクランプ
    function clampInput(input) {
      const min = parseInt(input.min);
      const max = parseInt(input.max);
      const val = parseInt(input.value) || 0;
      input.value = Math.min(max, Math.max(min, val));
    }

    [hInput, mInput, sInput].forEach(el => {
      el.addEventListener('change', () => clampInput(el));
    });

    // バックグラウンドタブ復帰時に表示を即時補正
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state === 'running') {
        tick();
      }
    });

    btnStart.addEventListener('click', start);
    btnPause.addEventListener('click', pause);
    btnReset.addEventListener('click', reset);

    renderUI();
    updateDisplay(0);
  </script>
</body>
</html>
